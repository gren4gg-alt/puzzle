<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Co-op Puzzle Mechanics — isolated tests</title>
<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body {
    margin:0; padding:0; min-height:100%;
    background:#1b1d24; color:#e8e8ef;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display:flex; flex-direction:column; align-items:center;
    overscroll-behavior:none;
  }
  h1 { font-size:16px; font-weight:600; margin:14px 0 8px; letter-spacing:.3px; }
  #tabs { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; justify-content:center; }
  .tab {
    padding:7px 14px; border-radius:6px; cursor:pointer; font-size:13px;
    background:#2c3140; border:1px solid #3f4557; color:#b7bacb; user-select:none;
  }
  .tab.on { background:#4a5474; border-color:#6b78a0; color:#fff; }
  #wrap { position:relative; }
  canvas { background:#262a36; border:2px solid #3a3f4f; border-radius:6px; display:block; }
  #hud {
    position:absolute; top:10px; left:10px; font-size:12px; line-height:1.5;
    background:rgba(20,21,28,.68); padding:8px 10px; border-radius:6px;
    pointer-events:none; white-space:pre;
  }
  #desc { max-width:860px; margin:12px 16px 28px; font-size:13px; line-height:1.65; color:#b7bacb; }
  #desc b { color:#e8e8ef; }
  kbd { background:#33384a; border:1px solid #4a5068; border-radius:4px; padding:1px 6px; font-size:12px; }
</style>
</head>
<body>

<h1>Co-op puzzle mechanics — each testable in isolation</h1>
<div id="tabs"></div>
<div id="wrap">
  <canvas id="c" width="960" height="600"></canvas>
  <div id="hud"></div>
</div>
<div id="desc"></div>

<script src="engine.js"></script>
<script>
'use strict';
const { World, StaticBody, OneWayPlatform, MovingPlatform, Box, Player,
        PressurePlate, LinkedDoor, Seesaw } = window.Engine;

const LOGICAL_W = 960, LOGICAL_H = 600;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');

// --- Two locally-controlled players so co-op mechanics are testable solo.
// P1: WASD.  P2: arrow keys.  (Networking replaces this later; each client
// drives one player and the host runs the same World.step.)
const held = new Set();
addEventListener('keydown', e => { held.add(e.code); if(['Space','ArrowUp','ArrowDown'].includes(e.code)) e.preventDefault(); });
addEventListener('keyup',   e => held.delete(e.code));
addEventListener('blur',    () => held.clear());
const inputP1 = () => ({ left:held.has('KeyA'), right:held.has('KeyD'), jump:held.has('KeyW'), action:held.has('KeyE') });
const inputP2 = () => ({ left:held.has('ArrowLeft'), right:held.has('ArrowRight'), jump:held.has('ArrowUp'), action:held.has('ShiftRight') });

// ---------------------------------------------------------------------------
// Scenes — each isolates ONE mechanic.
// ---------------------------------------------------------------------------
const SCENES = {
  plate: {
    name: '1 · Button hold-and-go',
    desc: `A <b>pressure plate</b> (purple) opens the linked <b>door</b> (red) only while something rests on it — ` +
          `release is instant, no lingering. One player must hold the plate while the other passes the door, ` +
          `or wedge a <b>box</b> on it to free both. The right-hand plate is <b>players-only</b> (a box won't fool it). ` +
          `Note the door <b>stops rather than crushing</b> anyone standing in it — that safety comes from the same ` +
          `kinematic pipeline moving platforms use. Plates sit <b>flush with the floor surface</b>: the engine has no ` +
          `step-up, so a raised lip would block walking.`,
    build() {
      const w = new World();
      // floor with two flush notches for the plates
      w.add(new StaticBody(0,540,240,60));
      w.add(new StaticBody(340,540,180,60));
      w.add(new StaticBody(620,540,340,60));
      const plateA = w.add(new PressurePlate(240,540,100,12,['doorA']));           // accepts boxes
      const plateB = w.add(new PressurePlate(520,540,100,12,['doorA'],false));      // players only
      const door   = w.add(new LinkedDoor('doorA',780,400,26,140,{x:0,y:-150},220));
      w.add(new StaticBody(0,0,16,600)); w.add(new StaticBody(944,0,16,600));
      w.add(new Box(160,480,44,44));
      const p1 = w.add(new Player(80,480));
      const p2 = w.add(new Player(430,480));
      return { w, players:[p1,p2], watch:{plateA,plateB,door} };
    },
    hud(s){ return `plateA(boxes ok): ${s.watch.plateA.active?'ACTIVE':'—'}  occ:${s.watch.plateA.occupants}\n` +
                   `plateB(players): ${s.watch.plateB.active?'ACTIVE':'—'}  occ:${s.watch.plateB.occupants}\n` +
                   `door: ${s.watch.door.open?'OPENING/OPEN':'CLOSING/CLOSED'}  y:${s.watch.door.y.toFixed(0)}`; }
  },

  boost: {
    name: '2 · Boost stacking gate',
    desc: `No new physics — a <b>level-design gate</b>. A single jump clears ~92px; standing on a partner's head adds ` +
          `their 40px body, so ~132px is reachable together. The <b>gold ledge sits 120px up</b>: impossible solo, ` +
          `reachable boosted. Stand P2 on P1's head, then jump. Riders are carried when the bottom player walks, so ` +
          `you can reposition the tower while stacked, and 3+ towers work too. The grey ledge at 200px is out of reach ` +
          `even boosted — a deliberate reference point.`,
    build() {
      const w = new World();
      w.add(new StaticBody(0,540,960,60));
      w.add(new StaticBody(0,0,16,600)); w.add(new StaticBody(944,0,16,600));
      const reachable = w.add(new StaticBody(560,420,220,20));   // 120px up — boost only
      reachable.color = '#c9a24b';
      // Unreachable reference ledge, kept well clear (200px up) so there's
      // room to actually stand on the gold one beneath it.
      w.add(new StaticBody(560,340,220,10));
      // Tower starts to the LEFT of the ledge so the boost jump has
      // somewhere to land — stacking directly under it just bonks heads.
      const p1 = w.add(new Player(470,480));
      const p2 = w.add(new Player(470,380));
      return { w, players:[p1,p2], watch:{reachable} };
    },
    hud(s){
      const [p1,p2]=s.players;
      const stacked = p2.groundEntity===p1 || p1.groundEntity===p2;
      const onLedge = [p1,p2].filter(p=>p.groundEntity===s.watch.reachable).length;
      return `stacked: ${stacked?'YES':'no'}\nplayers on gold ledge: ${onLedge}\n` +
             `P1 ground: ${p1.groundEntity?p1.groundEntity.constructor.name:'air'}\n` +
             `P2 ground: ${p2.groundEntity?p2.groundEntity.constructor.name:'air'}`;
    }
  },

  seesaw: {
    name: '3 · Seesaw / weight platform',
    desc: `A <b>seesaw</b> built as two plank halves that move oppositely — two AABBs rather than a rotated body, so it ` +
          `stays compatible with the engine's axis-aligned collision while reading as a tilt. Tilt is the normalized ` +
          `<b>weight difference</b> between sides and <b>eases</b> toward its target rather than snapping, so clients ` +
          `interpolating between snapshots never see it jump. Stand on one side, or throw a box on, and watch it swing. ` +
          `The right seesaw uses <b>weighted boxes</b> (weight 3) so one box outweighs a player.`,
    build() {
      const w = new World();
      w.add(new StaticBody(0,540,960,60));
      w.add(new StaticBody(0,0,16,600)); w.add(new StaticBody(944,0,16,600));
      const ssA = new Seesaw(120,380,300,16,{ maxRise:46, tiltRate:2.0, balanceWeight:1 }).addTo(w);
      const ssB = new Seesaw(560,380,300,16,{ maxRise:46, tiltRate:2.0, balanceWeight:3 }).addTo(w);
      const heavy = w.add(new Box(600,300,44,44)); heavy.weight = 3; heavy.color = '#8a4a2a';
      w.add(new Box(200,280,40,40));
      const p1 = w.add(new Player(150,300));
      const p2 = w.add(new Player(760,300));
      return { w, players:[p1,p2], watch:{ssA,ssB} };
    },
    hud(s){ const a=s.watch.ssA,b=s.watch.ssB;
      return `seesaw A  L:${a.leftWeight} R:${a.rightWeight}  tilt:${a.tilt.toFixed(2)}\n` +
             `seesaw B  L:${b.leftWeight} R:${b.rightWeight}  tilt:${b.tilt.toFixed(2)}  (balanceWeight 3)`; }
  },
};

let sceneKey = 'plate';
let scene = null;

function loadScene(k){
  sceneKey = k;
  scene = SCENES[k].build();
  document.getElementById('desc').innerHTML = SCENES[k].desc +
    `<div style="margin-top:8px;color:#8a8ea0">` +
    `<b>P1</b> <kbd>A</kbd><kbd>D</kbd> move <kbd>W</kbd> jump <kbd>E</kbd> grab/throw &nbsp;·&nbsp; ` +
    `<b>P2</b> <kbd>←</kbd><kbd>→</kbd> move <kbd>↑</kbd> jump <kbd>RShift</kbd> grab/throw &nbsp;·&nbsp; <kbd>R</kbd> reset scene</div>`;
  [...document.querySelectorAll('.tab')].forEach(t=>t.classList.toggle('on', t.dataset.k===k));
}

const tabs = document.getElementById('tabs');
Object.keys(SCENES).forEach(k=>{
  const d=document.createElement('div');
  d.className='tab'; d.dataset.k=k; d.textContent=SCENES[k].name;
  d.onclick=()=>loadScene(k);
  tabs.appendChild(d);
});
addEventListener('keydown', e=>{ if(e.code==='KeyR') loadScene(sceneKey); });
loadScene('plate');

// ---------------------------------------------------------------------------
// Fixed-timestep loop (identical structure to the main game loop, so what
// you see here is what the networked host will run).
// ---------------------------------------------------------------------------
const STEP = 1/60;
let acc=0, last=performance.now(), frames=0, fps=0, fpsT=0;

function tick(now){
  requestAnimationFrame(tick);
  let dt=(now-last)/1000; last=now; dt=Math.min(dt,.25); acc+=dt;
  const i1=inputP1(), i2=inputP2();
  while(acc>=STEP){
    const [p1,p2]=scene.players;
    p1.handleInput(i1,STEP); scene.w.updateCarrying(p1,i1);
    p2.handleInput(i2,STEP); scene.w.updateCarrying(p2,i2);
    scene.w.step(STEP);
    acc-=STEP;
  }
  fpsT+=dt; frames++;
  if(fpsT>=.5){ fps=Math.round(frames/fpsT); frames=0; fpsT=0; }
  render();
}

function render(){
  ctx.clearRect(0,0,LOGICAL_W,LOGICAL_H);
  const [p1,p2]=scene.players;

  for(const e of scene.w.entities){
    let col = e.color;
    if(e instanceof PressurePlate && e.active) col = e.activeColor;
    ctx.fillStyle = col;
    ctx.fillRect(e.x,e.y,e.w,e.h);

    if(e instanceof PressurePlate){
      ctx.strokeStyle = e.active ? '#e6ccff' : '#6b4a99';
      ctx.lineWidth = 2; ctx.strokeRect(e.x+1,e.y+1,e.w-2,e.h-2);
      if(!e.acceptsBoxes){
        ctx.fillStyle='#e6ccff'; ctx.font='9px sans-serif'; ctx.textAlign='center';
        ctx.fillText('PLAYERS ONLY', e.x+e.w/2, e.y-4); ctx.textAlign='left';
      }
    }
    if(e.carried){ ctx.strokeStyle='#ffe082'; ctx.lineWidth=2; ctx.strokeRect(e.x+1,e.y+1,e.w-2,e.h-2); }
  }

  // player markers
  [[p1,'P1','#4bd07a'],[p2,'P2','#4bb8d0']].forEach(([p,label,col])=>{
    ctx.fillStyle=col; ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.fillStyle='#1b1d24';
    ctx.fillRect(p.facing>0?p.x+p.w-8:p.x+4, p.y+8, 4,4);
    ctx.font='10px sans-serif'; ctx.fillStyle='#0d0f14'; ctx.textAlign='center';
    ctx.fillText(label, p.x+p.w/2, p.y+p.h-6); ctx.textAlign='left';
    if(p.grounded){ ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.strokeRect(p.x+1,p.y+1,p.w-2,p.h-2); }
  });

  hud.textContent = `fps ${fps}\n` + SCENES[sceneKey].hud(scene) + `\n[R] reset scene`;
}
requestAnimationFrame(tick);
</script>
</body>
</html>
