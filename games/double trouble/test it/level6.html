<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Duble Trouble — Blackout</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#14141c; color:#e6e6f0;
               font-family: system-ui, -apple-system, sans-serif;
               -webkit-user-select:none; user-select:none; }

  /* ---- Three.js Background Canvas ---- */
  #bg-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
  }

  /* Replaces the old #lobby host/join screen — this page only ever
     arrives via hand-off from the lobby (see HANDOFF CONTRACT in
     netcode.js), so there's nothing to host/join here. Just a status
     line while the session resumes, or an error if there's nothing to
     resume. */
  #boot { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
          justify-content:center; gap:10px; padding:24px; z-index:20; background:#14141c;
          text-align:center; }
  #boot h1 { margin:0; font-size:20px; font-weight:600; }
  #bootStatus { font-size:13px; color:#8a8aa0; }

  #ended { position:fixed; inset:0; z-index:30; display:none; flex-direction:column;
           align-items:center; justify-content:center; gap:16px; background:rgba(20,20,28,.94);
           text-align:center; padding:24px; }
  #ended.on { display:flex; }
  #endedBtn { font:inherit; padding:11px 18px; border-radius:8px; border:1px solid #3a3a4c;
              background:#242430; color:#e6e6f0; cursor:pointer; }

  #stage { position:fixed; inset:0; display:none; z-index: 1; }
  #stage.on { display:block; }
  canvas#game { display:block; width:100%; height:100%; touch-action:none; background: transparent; }
  #hud { position:fixed; top:6px; left:8px; font:11px ui-monospace, monospace;
         color:#6a6a80; pointer-events:none; z-index:5; }

  #youAre { position:fixed; top:6px; left:50%; transform:translateX(-50%); z-index:5; display:none;
            align-items:center; gap:6px; font:12px system-ui, sans-serif;
            color:#c8c8d8; background:rgba(20,20,28,.6); padding:5px 10px;
            border-radius:20px; pointer-events:none; }
  #youAre.on { display:flex; }
  #youAreSwatch { width:14px; height:14px; border-radius:4px; box-shadow:0 0 0 1px rgba(255,255,255,.25); }

  /* Countdown before play begins. The host's simulation is frozen while
     this runs (see frame()), so nothing can kill anyone during it. */
  #countdown { position:fixed; inset:0; z-index:25; display:none;
               flex-direction:column; align-items:center; justify-content:center;
               gap:6px; pointer-events:none; background:rgba(14,14,21,.45); }
  #countdown.on { display:flex; }
  #cdNum { font:700 92px system-ui, sans-serif; color:#ffe08a;
           text-shadow:0 4px 24px rgba(0,0,0,.7); line-height:1;
           animation:cdPop .45s ease-out; }
  #cdHint { font-size:14px; color:#c8c8d8; }
  @keyframes cdPop { from { transform:scale(.55); opacity:0 } to { transform:scale(1); opacity:1 } }

  /* Transient centre-screen message (death, restart, someone exited). */
  #toast { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
           z-index:22; display:none; font:600 22px system-ui, sans-serif;
           color:#e6e6f0; background:rgba(20,20,28,.82); padding:12px 22px;
           border-radius:12px; pointer-events:none; text-align:center;
           border:1px solid #3a3a4c; }
  #toast.on { display:block; }

  #exitProg { position:fixed; bottom:10px; left:50%; transform:translateX(-50%);
              z-index:5; display:none; font:12px system-ui, sans-serif; color:#c8c8d8;
              background:rgba(20,20,28,.6); padding:5px 12px; border-radius:20px;
              pointer-events:none; }
  #exitProg.on { display:block; }

  #touch { display:none; position:fixed; inset:auto 0 0 0; z-index:10;
           padding:0 16px 16px; justify-content:space-between; pointer-events:none; }
  @media (pointer: coarse) { #touch { display:flex; } }
  .pad { display:flex; gap:10px; pointer-events:auto; }
  /* 50px is about the smallest a thumb target should go — below ~44px
     accuracy falls off badly, and these get pressed under pressure. */
  .tbtn { width:50px; height:50px; border-radius:50%; border:1px solid #45455e;
          background:rgba(40,40,58,.72); color:#d8d8ea; font-size:16px;
          display:flex; align-items:center; justify-content:center;
          backdrop-filter: blur(3px); }
  .tbtn.pressed { background:rgba(90,90,130,.9); }

  #rotate { position:fixed; inset:0; z-index:40; display:none;
            flex-direction:column; align-items:center; justify-content:center;
            gap:14px; background:#14141c; text-align:center; padding:24px; }
  #rotate span { font-size:44px; }
  @media (pointer: coarse) and (orientation: portrait) { #rotate { display:flex; } }

  /* ---- voice/settings overlay (top-right, persistent once in-game) ---- */
  #voiceBar { position:fixed; top:6px; right:8px; z-index:60; display:none;
              align-items:center; gap:6px; }
  #voiceBar.on { display:flex; }
  .vbtn { width:30px; height:30px; border-radius:50%; border:1px solid #45455e;
          background:rgba(36,36,48,.85); color:#d8d8ea; font-size:14px; cursor:pointer;
          display:flex; align-items:center; justify-content:center; padding:0; }
  .vbtn.muted { background:#5a2f36; border-color:#7a3f46; }
  .vdots { display:flex; gap:4px; }
  .vdot { width:8px; height:8px; border-radius:50%; background:#3a3a4c; }
  .vdot.speaking { background:#5fd68a; box-shadow:0 0 4px #5fd68a; }

  #voicePanel { position:fixed; top:44px; right:8px; z-index:15; display:none;
                flex-direction:column; gap:10px; background:rgba(24,24,32,.95);
                border:1px solid #3a3a4c; border-radius:10px; padding:12px; width:220px;
                font-size:13px; }
  #voicePanel.on { display:flex; }
  .vrow { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .seg { display:flex; border:1px solid #3a3a4c; border-radius:6px; overflow:hidden; }
  .seg button { font:inherit; font-size:12px; padding:5px 8px; border:none; background:#242430;
                color:#e6e6f0; cursor:pointer; }
  .seg button.active { background:#3a3a5c; }
  .peerRow { display:flex; align-items:center; gap:6px; }
  .peerRow input[type=range] { flex:1; }
  #leaveBtn { font:inherit; padding:8px; border-radius:6px; border:1px solid #5a2f36;
              background:#3a2226; color:#e6e6f0; cursor:pointer; }
</style>
</head>
<body>

<!-- Three.js Background Canvas -->
<canvas id="bg-canvas"></canvas>

<div id="rotate">
  <span>&#8635;</span>
  <div>Rotate your device to landscape</div>
  <div style="font-size:13px;color:#8a8aa0">This is shared-screen co-op &mdash; it needs the width.</div>
</div>

<div id="boot">
  <h1>Duble Trouble</h1>
  <div id="bootStatus">Resuming session…</div>
  <button id="soloBtn" type="button" style="display:none;font:inherit;padding:11px 18px;
    border-radius:8px;border:1px solid #3a3a4c;background:#242430;color:#e6e6f0;cursor:pointer;">
    Test solo (no lobby)
  </button>
</div>

<div id="ended">
  <div style="font-size:18px;font-weight:600" id="endedMsg">Session ended</div>
  <button id="endedBtn">Back</button>
</div>

<div id="stage">
  <canvas id="game"></canvas>
</div>
<div id="hud"></div>
<div id="countdown"><div id="cdNum">3</div><div id="cdHint">Get ready…</div></div>
<div id="toast"></div>
<div id="exitProg"></div>
<div id="youAre"><span id="youAreSwatch"></span><span>You</span></div>

<div id="voiceBar">
  <div class="vdots" id="voiceDots"></div>
  <button class="vbtn" id="selfMuteBtn" type="button" aria-label="Mute microphone">&#127908;</button>
  <button class="vbtn" id="settingsBtn" type="button" aria-label="Voice settings">&#9881;</button>
</div>
<div id="voicePanel">
  <div class="vrow">
    <span>Voice mode</span>
    <div class="seg" id="modeSwitch">
      <button type="button" data-mode="always">Always on</button>
      <button type="button" data-mode="ptt">Push (V)</button>
    </div>
  </div>
  <div id="peerList"></div>
  <button id="leaveBtn" type="button">Leave session</button>
</div>

<div id="touch">
  <div class="pad">
    <div class="tbtn" id="btnLeft">&#9664;</div>
    <div class="tbtn" id="btnRight">&#9654;</div>
  </div>
  <div class="pad">
    <div class="tbtn" id="btnAction">&#9995;</div>
    <div class="tbtn" id="btnJump">&#9650;</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script src="engine.js"></script>
<script src="input.js"></script>

<!-- ==========================================================================
     Three.js Atmospheric Dark Valley Background Setup (Violet Grass Accent)
     ========================================================================== -->
<script>
(function() {
  "use strict";
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // Create background particles (stars / dust)
  const particleCount = 40;
  const particles = [];

  for (let i = 0; i < particleCount; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 2.5 + 0.5,
      speed: Math.random() * 0.4 + 0.1, // Horizontal drift speed
      opacity: Math.random() * 0.7 + 0.3
    });
  }

  function animateBG() {
    requestAnimationFrame(animateBG);

    // Deep twilight background gradient
    const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, '#141026');
    grad.addColorStop(1, '#0d0b18');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Update and draw moving particles
    ctx.fillStyle = '#b19cd9'; // Soft violet tint to match your game vibe
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      
      // Move particle to the left
      p.x -= p.speed;
      
      // If it goes off-screen, wrap it back around to the right
      if (p.x < 0) {
        p.x = canvas.width;
        p.y = Math.random() * canvas.height;
      }

      ctx.globalAlpha = p.opacity;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1.0; // Reset alpha
  }

  animateBG();
})();
</script>
<!-- ==========================================================================
     Level 6: Blackout — inlined here in place of level.js.

     A long memory run. The level is lit for 3 seconds, then the screen goes
     black for 3 seconds, over and over. You get one look at what is ahead,
     then you have to run it blind.

     Because of that, every hurdle here is STATIC — pits, ledges, ceilings
     and spike beds, all in fixed positions. Nothing moves and nothing
     spawns, so the level is memorisable, which is the whole game. Resist
     adding moving hazards later: blind + unpredictable is not a memory
     challenge, it is a coin flip.

     The blackout is a DOM overlay over the canvas, driven on a wall-clock
     cycle, plus a Back button. Both are built at the bottom of this file —
     no change to the shell's draw loop or its markup.
     ========================================================================== -->
<script>
(function () {
"use strict";

const { StaticBody, TriggerZone, MovingPlatform, Box } = window.Engine;

/* ---- Tunables -------------------------------------------------------- */
// LIT: you can see the level, but you cannot move. Look, and plan.
// DARK: you can move, but you cannot see. Run it from memory.
const LIT_SECONDS   = 5;      // lit and frozen
const DARK_SECONDS  = 4;      // dark and free to move
const FADE_MS       = 220;    // fade between the two, so it isn't a hard cut
const DARKNESS      = 1;      // total black — nothing visible at all while
                              // the lights are out.
const FELL_MS       = 1600;   // how long the "who fell" notice stays up
const PHASE_SYNC_MS  = 1000;  // how often the host republishes its light phase
const VOTE_TIMEOUT  = 10000;  // a vote lapses if it does not carry in this long
const VOTE_MAJORITY = 0.5;    // fraction of live players that must agree
                              // (strictly more than this, so 0.5 = majority)
const BACK_URL      = 'index.html';
/* ---------------------------------------------------------------------- */

const VIEW_MODE = 'follow';

const H_       = 760;
const GROUND_Y = 600;        // the solid ground of the final section
const LEDGE_H  = 16;         // ledges are thin: miss one and you fall

// PHYSICS.JUMP_VELOCITY 560 against GRAVITY 1700 is ~0.66s airborne, and
// MOVE_SPEED 260 covers ~171px in that time. Every gap below is checked
// against this, because a gap you cannot clear is unfair in the light and
// impossible in the dark.
const MAX_JUMP = Math.round((2 * 560 / 1700) * 260);

// The cycle is measured from the moment the stage goes live, not from the
// raw clock — so a run always opens with a full lit phase to look around in,
// instead of dropping you into whatever part of the cycle the wall clock
// happened to be in. Each peer anchors when its own stage appears; netcode's
// start countdown is what keeps those moments together.
const CYCLE_MS = (LIT_SECONDS + DARK_SECONDS) * 1000;
const LIT_MS   = LIT_SECONDS * 1000;

// The HOST's epoch is the only one that counts: the host is the only side
// that freezes movement, so a client running its own anchor would show a
// countdown that disagreed with when it could actually move. The host
// publishes its phase and clients adopt it.
let epoch = null;                       // set on the first live frame
let epochFromHost = false;              // true once a client has adopted
function startLights() { if (epoch === null) epoch = Date.now(); }
function adoptEpoch(elapsedMs) {
  // Rebuild the host's anchor from how far into the cycle it says it is.
  epoch = Date.now() - elapsedMs;
  epochFromHost = true;
}
function isLit() {
  // Before the stage is up, treat it as lit: that keeps players frozen
  // through the countdown rather than free-running in the dark.
  if (epoch === null) return true;
  return ((Date.now() - epoch) % CYCLE_MS) < LIT_MS;
}
// Exported so the shell's draw() can black the canvas out at source. It is
// declared inside this IIFE, so draw() cannot see the bare name — a check
// for a global `isLit` would silently always be false.
window.LevelLights = { isLit: isLit };

// Host-authoritative: only the host simulates, so only the host freezes.
const IS_HOST = (function () {
  try {
    const raw = sessionStorage.getItem('dt-session');
    if (!raw) return true;
    return (JSON.parse(raw).role || 'host') !== 'client';
  } catch (e) { return true; }
})();

let worldRef = null;   // set in build(), used by the Restart button

// Set by the host when someone crosses the kill line, and mirrored to
// clients over the level-message relay when that exists. The overlay loop
// reads it; nothing else depends on it, so an older netcode simply means
// clients do not get the notice while the host still does.
let lastFall = null;
function reportFall(slot, color) {
  lastFall = { slot: slot, color: color, at: Date.now() };
  try {
    const H = window.Netcode && window.Netcode.Host;
    if (H && typeof H.broadcastLevelMsg === 'function') {
      H.broadcastLevelMsg({ k: 'fell', slot: slot, color: color });
    }
  } catch (e) {}
}

// -- Layout
// A jump peaks around 92px and carries about 171px. These stay well inside
// both, because every one of them has to be clearable blind, from memory —
// a gap that needs a precise jump in the light is a guess in the dark.
const STEP_GAP     = 90;     // horizontal gap between the opening ledges
const STEP_RISE    = 55;     // how much each one climbs (60% of jump height)
const LIFT_SPEED   = 70;     // px/s for the vertical platform
const STAIR_STEPS  = 6;      // steps in the descending diagonal. Fewer steps
                             // means the stair ends higher up, which is what
                             // leaves a real drop from the boost ledge down
                             // to the ground below it.
const STAIR_RUN    = 62;     // width of each step
const STAIR_DROP   = 24;     // drop per step
const GROUND_W     = 520;    // the ground strip under the boost ledge
const EXIT_GAP     = 90;     // the gap between the ground and the exit ledge
const EXIT_HEIGHT  = 120;    // exit ledge above the ground. A jump clears ~92,
                             // so it cannot be reached from the ground alone —
                             // you need a teammate's head on the way up, and
                             // the box on the way back for whoever is left.

const LAND_COLOR  = '#a778d6';
const BLOCK_COLOR = '#8a5fbd';
const SPIKE_COLOR = '#e05a6a';
const GOAL_COLOR  = '#f0c419';

window.Level = {
  // Set once the layout below is laid out, since the length is the sum of
  // the segments rather than a number picked in advance.
  WIDTH: 0,
  HEIGHT: H_,
  VIEW_MODE: VIEW_MODE,

  spawnPoint(slot) {
    return { x: 60 + (slot % 4) * 34, y: 560 - 40 - Math.floor(slot / 4) * 44 };
  },

  build(world, nw) {
    world.deathY = H_ + 80;

    // Everything here is a thin ledge over open air, so falling has to kill —
    // which means the camera's bottom wall must be off, or players would
    // land on invisible floor instead.
    world.cameraOpts = { blockBottom: false };

    function ledge(x, y, w) {
      const b = new StaticBody(x, y, w, LEDGE_H);
      b.color = LAND_COLOR;
      world.add(b);
      return b;
    }
    function ground(x, y, w) {
      const b = new StaticBody(x, y, w, H_ - y);
      b.color = LAND_COLOR;
      world.add(b);
      return b;
    }

    /* ---- 1. Opening: three ledges, stepping up -------------------------
       Generous landings and modest rises. The difficulty in this level is
       remembering where things are, not hitting them precisely.
       ------------------------------------------------------------------ */
    const l1y = 560;
    const l2y = l1y - STEP_RISE;
    const l3y = l2y - STEP_RISE;
    ledge(40,   l1y, 300);                    // ends 340
    ledge(340 + STEP_GAP, l2y, 280);          // 430 .. 710
    ledge(710 + STEP_GAP, l3y, 300);          // 800 .. 1100

    /* ---- 2. The lift ---------------------------------------------------
       A vertical moving platform is the only way up to the high ledge. In
       the dark this is the hardest thing to time, so its travel is slow and
       its cycle is short — you want it findable by memory, not by luck.
       ------------------------------------------------------------------ */
    // Sits one short hop off the end of the third ledge, and its bottom of
    // travel is level with that ledge — so you can step straight on rather
    // than having to catch it mid-sweep.
    const liftBottom = l3y;
    const liftTop    = l3y - 130;
    const lift = new MovingPlatform(1100 + 60, liftBottom, 120, 18,
      [{ x: 1160, y: liftBottom }, { x: 1160, y: liftTop }], LIFT_SPEED, 'pingpong', false);
    lift.color = BLOCK_COLOR;
    world.add(lift);
    nw.platforms.push(lift);

    /* ---- 3. The descent ------------------------------------------------
       The engine has no sloped surfaces, so the diagonal is a staircase of
       small ledges. Each step drops less than a jump height, so it can be
       walked down without any of them being a commitment you cannot undo.
       ------------------------------------------------------------------ */
    const stairTopY = liftTop;
    ledge(1320, stairTopY, 180);              // 1320 .. 1500
    for (let i = 0; i < STAIR_STEPS; i++) {
      ledge(1500 + i * STAIR_RUN, stairTopY + (i + 1) * STAIR_DROP, STAIR_RUN);
    }

    /* ---- 4. The boost ---------------------------------------------------
       This ledge sits too far below the next for one player to make alone.
       Someone has to stand on someone else. Nothing enforces it — the gap
       just is not jumpable solo.
       ------------------------------------------------------------------ */
    const stairEndX = 1500 + STAIR_STEPS * STAIR_RUN;
    const boostY = stairTopY + STAIR_STEPS * STAIR_DROP;
    ledge(stairEndX, boostY, 300);

    /* ---- 5. The box and the exit ---------------------------------------
       The ground sits well below the boost ledge, and the exit ledge is
       across a gap AND above a jump — so the ground is a place you drop
       into, not a place you can leave alone.

       The box starts up on the exit ledge, out of reach. The first player
       up (boosted off a teammate) has to throw it back down, and whoever
       is still on the ground uses it as the step that clears both the gap
       and the height.
       ------------------------------------------------------------------ */
    const groundX = stairEndX + 380;
    ground(groundX, GROUND_Y, GROUND_W);

    const exitY = GROUND_Y - EXIT_HEIGHT;
    const exitX = groundX + GROUND_W + EXIT_GAP;
    ledge(exitX, exitY, 320);

    const box = new Box(exitX + 40, exitY - 44, 44, 44);
    world.add(box);
    nw.boxes.push(box);

    const goal = new TriggerZone(exitX + 210, exitY - 56, 70, 56,
                                 { effect: 'goal', kind: 'exit' });
    goal.color = GOAL_COLOR;
    world.add(goal);
    nw.triggers.push(goal);

    window.Level.WIDTH = exitX + 320 + 60;
    world.levelBounds = { minX: 0, minY: 0, maxX: window.Level.WIDTH, maxY: H_ };

    nw.winCondition = { type: 'reach-goal', mode: 'each', goals: [goal] };

    worldRef = world;

    /* ---- The freeze ----------------------------------------------------
       Chained onto world.step, which netcode's host loop calls each tick.
       netcode has already written this tick's input mask onto every player
       by the time we get here, so zeroing the masks BEFORE the engine step
       is what actually holds them still — clearing velocity afterwards
       would still let a frame of movement through.

       Vertical velocity is left alone, so a player caught mid-jump when the
       lights come up still falls and lands rather than hanging in the air.
       Moving platforms keep running too: freezing those would let you park
       on the lift and wait out the light for free.
       ------------------------------------------------------------------ */
    const engineStep = world.step.bind(world);
    const fallen = new Map();     // slot -> was below the kill line last tick

    world.step = function (dt) {
      if (IS_HOST && isLit()) {
        for (const p of nw.players.values()) {
          if (!p) continue;
          p._mask = 0;
          p.vx = 0;
        }
      }
      engineStep(dt);

      // Who fell, detected from POSITION rather than from p.dead. The dead
      // flag is not in the sync payload (character.js's dead state is still
      // stubbed), so it is never set on a client and cannot be relied on
      // host-side either. Crossing the kill line is unambiguous on the host,
      // which is the only side that simulates.
      if (!IS_HOST) return;
      for (const p of nw.players.values()) {
        if (!p) continue;
        const below = p.y > world.deathY;
        if (below && !fallen.get(p._slot)) {
          reportFall(p._slot, p.color);
        }
        fallen.set(p._slot, below);
      }
    };
  },
};

/* ---- Blackout overlay + controls --------------------------------------
   Plain DOM on top of the canvas, so the shell's draw loop and markup stay
   untouched.

   The veil reads the same isLit() the host freeze uses, so what you see and
   what the simulation is doing can never disagree. Peers whose system
   clocks differ will drift apart by that difference; if that ever matters,
   the fix is to derive the phase from the host tick instead.
   ---------------------------------------------------------------------- */
(function blackout() {

  // z-index 59 puts the veil over everything the shell draws — stage,
  // HUD, the "You" badge, touch controls, the voice panel — and under only
  // #voiceBar (60), which holds Back and Restart. Those have to stay
  // reachable while you cannot see anything else.
  // The canvas is blacked out AFTER the shell's draw() has run, not instead
  // of it. Returning early from draw() skipped the entity loop, which is
  // also where lastPos and the per-player animation states advance — so a
  // whole dark phase went by without them updating and everything lurched
  // when the lights came back. Now the frame is drawn in full and then
  // painted over, which costs a wasted draw and keeps every clock honest.
  let drawWrapped = false;
  function wrapDraw() {
    if (drawWrapped) return;
    if (typeof draw !== 'function' || typeof ctx === 'undefined') return;
    const inner = draw;
    draw = function () {
      inner();
      if (!isLit() && stageLive()) {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
      }
    };
    drawWrapped = true;
  }

  const veil = document.createElement('div');
  veil.style.cssText =
    'position:fixed;inset:0;background:#000;pointer-events:none;z-index:59;' +
    'opacity:0;';
  document.body.appendChild(veil);

  /* ---- Controls -------------------------------------------------------
     Added into the existing #voiceBar rather than as a second floating bar,
     so they inherit .vbtn and sit in the same row as the mic and gear —
     one group of controls in the top right, not two competing ones. The
     bar is already raised above the veil by its own stacking context.
     -------------------------------------------------------------------- */
  function mkVbtn(glyph, label, onclick) {
    const b = document.createElement('button');
    b.className = 'vbtn';
    b.type = 'button';
    b.innerHTML = glyph;
    b.title = label;
    b.setAttribute('aria-label', label);
    b.onclick = onclick;
    return b;
  }

  const bar = document.getElementById('voiceBar');

  /* ---- Vote to restart -------------------------------------------------
     Restarting mid-run undoes everyone's progress, so one player should not
     be able to do it alone. A majority of live players has to agree.

     Only the host can actually reset — it is the only side that simulates,
     and the reset reaches everyone through the normal snapshot path. So the
     host is also the one that tallies: clients send their vote up, the host
     counts, and broadcasts the running tally back so every screen shows the
     same "2/3".

     This rides on netcode's level-message relay. If that is not present
     (older netcode), the whole thing degrades to host-only restart rather
     than breaking — see voteSupported below.
     -------------------------------------------------------------------- */
  const NC = window.Netcode || {};
  const voteSupported = IS_HOST
    ? typeof (NC.Host && NC.Host.broadcastLevelMsg) === 'function'
    : typeof (NC.Client && NC.Client.sendLevelMsg) === 'function';

  const votes = new Map();      // slot -> timestamp of that player's vote
  let tally = { yes: 0, need: 0 };

  function liveCount() {
    const ps = playerList();
    return ps.length || 1;
  }
  function needed() {
    return Math.floor(liveCount() * VOTE_MAJORITY) + 1;   // strictly a majority
  }
  function pruneVotes() {
    const now = Date.now();
    for (const [slot, at] of votes) if (now - at > VOTE_TIMEOUT) votes.delete(slot);
  }
  function hostTally() {
    pruneVotes();
    const need = needed();
    const yes = votes.size;
    tally = { yes: yes, need: need };
    try { NC.Host.broadcastLevelMsg({ k: 'vote', yes: yes, need: need }); } catch (e) {}
    if (yes >= need) {
      votes.clear();
      tally = { yes: 0, need: need };
      try { NC.Host.broadcastLevelMsg({ k: 'vote', yes: 0, need: need }); } catch (e) {}
      if (worldRef) worldRef.pendingReset = true;
    }
  }

  if (IS_HOST && voteSupported) {
    NC.Host.onLevelMsg = function (slot, payload) {
      if (!payload || payload.k !== 'vote') return;
      votes.set(slot, Date.now());
      hostTally();
    };
  } else if (voteSupported) {
    NC.Client.onLevelMsg = function (payload) {
      if (!payload) return;
      if (payload.k === 'vote') {
        tally = { yes: payload.yes | 0, need: payload.need | 0 };
      } else if (payload.k === 'phase') {
        adoptEpoch(payload.e | 0);
      } else if (payload.k === 'fell') {
        lastFall = { slot: payload.slot | 0, color: payload.color, at: Date.now() };
      }
    };
  }

  let myVote = false;

  const restart = mkVbtn('&#8635;', 'Vote to restart', function () {
    if (!voteSupported) {
      // Older netcode with no relay: host restarts outright, a client
      // cannot ask at all, so say so instead of failing silently.
      if (IS_HOST && worldRef) worldRef.pendingReset = true;
      else flashBtn(restart, '&#10005;', 'Host only');
      return;
    }
    if (myVote) return;                     // one vote each, no toggling
    myVote = true;
    setTimeout(function () { myVote = false; }, VOTE_TIMEOUT);
    if (IS_HOST) {
      votes.set(typeof Host !== 'undefined' ? Host.mySlot : -1, Date.now());
      hostTally();
    } else {
      try { NC.Client.sendLevelMsg({ k: 'vote' }); } catch (e) {}
    }
  });

  function flashBtn(btn, glyph, title) {
    const was = btn.innerHTML, wasT = btn.title;
    btn.innerHTML = glyph; btn.title = title;
    setTimeout(function () { btn.innerHTML = was; btn.title = wasT; }, 1000);
  }

  const back = mkVbtn('&#8592;', 'Leave the level', function () {
    // Detaches the pagehide/beforeunload listener so leaving does not
    // broadcast a false 'bye' to the room.
    try { window.Netcode.Host.prepareHandoff(); } catch (e) {}
    location.href = BACK_URL;
  });

  // Running tally, shown only while a vote is actually open.
  const voteCount = document.createElement('span');
  voteCount.style.cssText =
    'display:none;align-items:center;padding:0 8px;height:30px;border-radius:15px;' +
    'background:rgba(36,36,48,.85);border:1px solid #45455e;color:#d8d8ea;' +
    'font:600 12px/1 system-ui,sans-serif;font-variant-numeric:tabular-nums;';

  if (bar) {
    bar.appendChild(voteCount);
    bar.appendChild(restart);
    bar.appendChild(back);
  }

  /* ---- Look-timer, shown only while the lights are up -----------------
     The lit phase is the only time you can plan, so the thing worth showing
     is how much of it is left. Nothing is drawn during the dark phase — the
     screen has to stay completely black, and a countdown there would be a
     light source pointing at the one thing you are meant to do from memory.
     -------------------------------------------------------------------- */
  // A ring that drains as the lit phase runs out, drawn on its own small
  // HTML5 canvas rather than styled as a text pill — the number alone gave
  // no sense of pace, and a shrinking arc reads at a glance without having
  // to parse digits mid-jump.
  const TIMER_PX = 56;
  const timerCanvas = document.createElement('canvas');
  timerCanvas.width = TIMER_PX * (window.devicePixelRatio || 1);
  timerCanvas.height = TIMER_PX * (window.devicePixelRatio || 1);
  timerCanvas.style.cssText =
    'position:fixed;top:44px;left:50%;transform:translateX(-50%);z-index:61;' +
    'display:none;width:' + TIMER_PX + 'px;height:' + TIMER_PX + 'px;' +
    'filter:drop-shadow(0 2px 8px rgba(0,0,0,.4));';
  document.body.appendChild(timerCanvas);
  const timerCtx = timerCanvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;

  function drawTimer(remaining) {
    const frac = Math.max(0, Math.min(1, remaining / LIT_SECONDS));
    const cx = TIMER_PX * dpr / 2, cy = cx, r = cx - 5 * dpr;
    const tctx = timerCtx;
    tctx.clearRect(0, 0, timerCanvas.width, timerCanvas.height);

    // Track
    tctx.beginPath();
    tctx.arc(cx, cy, r, 0, Math.PI * 2);
    tctx.strokeStyle = 'rgba(255,255,255,.14)';
    tctx.lineWidth = 4 * dpr;
    tctx.stroke();

    // Draining arc. Starts straight up and sweeps clockwise, so it reads as
    // a clock running down rather than an abstract loading spinner. Colour
    // shifts from the level's gold toward a warning red as time runs short,
    // which is the actual cue you react to without reading the number.
    const start = -Math.PI / 2;
    const end = start + Math.PI * 2 * frac;
    const warm = frac < 0.3;
    tctx.beginPath();
    tctx.arc(cx, cy, r, start, end);
    tctx.strokeStyle = warm ? '#e05a6a' : '#f0c419';
    tctx.lineWidth = 4 * dpr;
    tctx.lineCap = 'round';
    tctx.stroke();

    // Centre readout.
    tctx.fillStyle = '#e9e3f2';
    tctx.font = '600 ' + (15 * dpr) + 'px system-ui,-apple-system,Segoe UI,sans-serif';
    tctx.textAlign = 'center';
    tctx.textBaseline = 'middle';
    tctx.fillText(remaining.toFixed(1), cx, cy);
  }

  function litRemaining() {
    // Anchored to epoch, exactly like isLit() — this was left on the raw
    // wall clock after the epoch fix landed, which is why the timer and the
    // actual blackout drifted apart onscreen.
    if (epoch === null) return LIT_SECONDS;
    const into = (Date.now() - epoch) % CYCLE_MS;
    return Math.max(0, (LIT_MS - into) / 1000);
  }

  /* ---- Fall notice ----------------------------------------------------
     Reads players straight off the shell's `side` (Host or Client). `dead`
     is already part of the sync payload — it is what character.js draws its
     dead pose from — so both ends can spot a fall without any new message.

     Sits above the veil, because a fall in the dark is exactly the one you
     need told about: you cannot see it happen.
     -------------------------------------------------------------------- */
  const fell = document.createElement('div');
  fell.style.cssText =
    'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:61;' +
    'display:none;align-items:center;gap:10px;padding:12px 20px;border-radius:12px;' +
    'background:rgba(30,16,22,.92);border:1px solid rgba(224,90,106,.45);' +
    'color:#f4e6ea;font:600 15px/1 system-ui,-apple-system,Segoe UI,sans-serif;' +
    'box-shadow:0 4px 20px rgba(0,0,0,.5);';
  const fellSwatch = document.createElement('span');
  fellSwatch.style.cssText = 'width:14px;height:14px;border-radius:4px;display:inline-block;';
  const fellText = document.createElement('span');
  fell.appendChild(fellSwatch);
  fell.appendChild(fellText);
  document.body.appendChild(fell);

  let shownFallAt = 0;

  function playerList() {
    // `side` is a top-level `let` in the shell script. Top-level let is a
    // global binding shared across script tags, but it is NOT on window, so
    // it has to be read by bare name behind a typeof guard — this file runs
    // before the shell assigns it.
    try {
      if (typeof side === 'undefined' || !side || !side.renderList) return [];
      return side.renderList()
        .map(function (it) { return it.entity; })
        .filter(function (e) { return e && typeof e._slot === 'number'; });
    } catch (e) { return []; }
  }

  function checkFalls() {
    if (!lastFall || lastFall.at === shownFallAt) return;
    shownFallAt = lastFall.at;
    fellSwatch.style.background = lastFall.color || '#e05a6a';
    fellText.textContent = 'Player ' + ((lastFall.slot | 0) + 1) + ' fell';
  }

  /* ---- Phase sync -----------------------------------------------------
     Repeated rather than sent once, so a client that joins late, reloads,
     or drops a packet converges anyway — same self-healing pattern as the
     roster broadcast. It is a small message once a second, not per tick.
     -------------------------------------------------------------------- */
  let lastPhaseSend = 0;
  function publishPhase() {
    if (!IS_HOST || epoch === null) return;
    const now = Date.now();
    if (now - lastPhaseSend < PHASE_SYNC_MS) return;
    lastPhaseSend = now;
    try {
      const H = window.Netcode && window.Netcode.Host;
      if (H && typeof H.broadcastLevelMsg === 'function') {
        H.broadcastLevelMsg({ k: 'phase', e: now - epoch });
      }
    } catch (e) {}
  }

  /* ---- Phase loop ----------------------------------------------------- */
  // Only run while the stage is actually up — no point blacking out the
  // lobby or the end screen.
  const stage = document.getElementById('stage');
  let wasDark = null;

  // #stage is position:fixed, and a fixed element's offsetParent is ALWAYS
  // null — visible or not. Testing offsetParent here meant `live` was never
  // true, so the veil, the timer and the cycle anchor all sat dead. The
  // shell toggles the .on class to show the stage, so that is what to read.
  function stageLive() {
    return !!stage && stage.classList.contains('on');
  }

  (function loop() {
    // A throw inside a rAF callback stops the loop for good, which is how a
    // small error here turns into "the lights never came back". Keep going.
    try { frame(); } catch (e) { console.error('[level6] loop', e); }
    requestAnimationFrame(loop);
  })();

  function frame() {
    wrapDraw();                 // one-time, once the shell has defined draw()
    const live = stageLive();
    if (live) publishPhase();
    if (live) startLights();            // anchors once, on the first live frame
    const dark = live && !isLit();
    // Going dark is instant: a fade would hand you a few hundred ms of
    // dim-but-readable screen at the exact moment you start moving, which
    // is the one thing this level is not supposed to give you. Coming back
    // up still fades, since there is nothing to protect on that side.
    if (dark !== wasDark) {
      veil.style.transition = dark ? 'none' : 'opacity ' + FADE_MS + 'ms linear';
      wasDark = dark;
    }
    veil.style.opacity = dark ? String(DARKNESS) : '0';

    if (live) {
      checkFalls();
      const lit = isLit();
      timerCanvas.style.display = lit ? 'block' : 'none';
      if (lit) drawTimer(litRemaining());
      fell.style.display = (lastFall && Date.now() - lastFall.at < FELL_MS) ? 'flex' : 'none';

      if (IS_HOST && voteSupported && votes.size) pruneVotes();
      const open = tally.yes > 0;
      voteCount.style.display = open ? 'flex' : 'none';
      if (open) voteCount.textContent = tally.yes + '/' + tally.need;
      restart.style.opacity = myVote ? '0.5' : '1';
    } else {
      timerCanvas.style.display = 'none';
      fell.style.display = 'none';
    }
  }
})();

})();
</script>

<script src="netcode.js"></script>
<script src="character.js"></script>
<script src="progress.js"></script>
<script src="levels.js"></script>
<script src="voicechat.js"></script>
<script src="voicechat-adapter.js"></script>

<script>
"use strict";
(function () {

const { Host, Client, CFG, PALETTE } = window.Netcode;
const { Box, Player } = window.Engine;

const $ = id => document.getElementById(id);

// Where "back to lobby" goes. Relative to this page — adjust if level
// pages ever move into a subfolder relative to the lobby.
const LOBBY_URL = 'index.html';
const boot = $('boot'), bootStatus = $('bootStatus'), stage = $('stage'),
      hudEl = $('hud'), canvas = $('game');
const ctx = canvas.getContext('2d');

const setStatus = m => { bootStatus.textContent = m; };

const input = new window.InputManager();
window.bindTouchButton($('btnLeft'),   input, 'left');
window.bindTouchButton($('btnRight'),  input, 'right');
window.bindTouchButton($('btnJump'),   input, 'jump');
window.bindTouchButton($('btnAction'), input, 'action');

let side = null, peer = null, running = false, myPeerId = null;

// Matches the (pointer: coarse) media query that reveals #touch, so the
// view lift and the buttons can never disagree about whether the pad is
// on screen.
const TOUCH_UI = window.matchMedia('(pointer: coarse)').matches;
// How far up the world is nudged to clear the control pad, in screen px.
const TOUCH_VIEW_LIFT = 40;

const animStates = new WeakMap();
let lastFrameAt = performance.now();

let scale = 1, offX = 0, offY = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = cw * dpr; canvas.height = ch * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/* ---------- view rect ----------
   The region of level-space the window shows. In 'whole' mode that's the
   entire level (the original letterbox behaviour). In 'follow' mode it's
   engine.js's Camera, which already tracks the average of the live
   players and is clamped to levelBounds — it was being simulated and
   synced all along (nw.cameras[0], a static-lifecycle entry in netcode's
   TYPE_REGISTRY with blended x/y), it just was never rendered through.
   Reading it rather than recomputing a follow point locally means host
   and clients frame the shot identically, and the camera's collision
   walls line up with what you can actually see. */
function viewRect() {
  if (window.Level.VIEW_MODE === 'follow' && side && side.nw &&
      side.nw.cameras && side.nw.cameras[0]) {
    const c = side.nw.cameras[0];
    return { x: c.x, y: c.y, w: c.w, h: c.h };
  }
  return { x: 0, y: 0, w: window.Level.WIDTH, h: window.Level.HEIGHT };
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));

// ---- mobile fullscreen on rotate --------------------------------------
// Touch devices only. Turning to landscape goes fullscreen (the browser
// chrome eats a lot of the width this shared-screen level needs);
// turning back to portrait, or leaving fullscreen by any other route,
// puts the device back exactly how it was.
//
// The catch: requestFullscreen() needs a user gesture, and an
// orientationchange event does NOT count as one in Chrome/Firefox. So
// when the direct attempt is rejected we arm a one-shot listener and go
// fullscreen on the player's very next touch instead — which in practice
// is immediate, since they rotated in order to play. iOS Safari on
// iPhone has no element fullscreen at all; there the promise rejects,
// the armed touch also fails, and nothing breaks — the page just stays
// as it is. webkitRequestFullscreen is included for iPad and older
// WebKit.
const isTouch = window.matchMedia('(pointer: coarse)').matches;
const isLandscape = () => window.matchMedia('(orientation: landscape)').matches;
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement || null;

// What the orientation lock was before we touched it, so exiting can put
// it back rather than just guessing 'portrait'. null = never locked.
let priorOrientation = null;
let armed = false;

function lockLandscape() {
  const o = screen.orientation;
  if (!o || typeof o.lock !== 'function') return;
  if (priorOrientation === null) priorOrientation = o.type || null;
  // Rejects on desktop and on browsers that gate it — harmless either way.
  o.lock('landscape').catch(() => {});
}

function restoreOrientation() {
  const o = screen.orientation;
  if (o && typeof o.unlock === 'function' && priorOrientation !== null) {
    try { o.unlock(); } catch (e) {}
  }
  priorOrientation = null;
}

function armGesture() {
  if (armed) return;
  armed = true;
  const go = () => {
    armed = false;
    window.removeEventListener('pointerdown', go);
    window.removeEventListener('touchend', go);
    if (isLandscape()) enterFullscreen();
  };
  window.addEventListener('pointerdown', go, { once: true });
  window.addEventListener('touchend', go, { once: true });
}

function enterFullscreen() {
  if (!isTouch || fsEl()) return;
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req) return;
  let p;
  try { p = req.call(el, { navigationUI: 'hide' }); } catch (e) { p = null; }
  if (p && typeof p.then === 'function') {
    p.then(lockLandscape).catch(armGesture);
  } else {
    // Older WebKit returns undefined rather than a promise.
    lockLandscape();
  }
}

function exitFullscreen() {
  restoreOrientation();
  if (!fsEl()) return;
  const ex = document.exitFullscreen || document.webkitExitFullscreen;
  if (ex) { try { ex.call(document); } catch (e) {} }
}

function syncFullscreenToOrientation() {
  if (!isTouch) return;
  if (isLandscape()) enterFullscreen();
  else exitFullscreen();
}

if (isTouch) {
  window.addEventListener('orientationchange', () => setTimeout(syncFullscreenToOrientation, 150));
  // orientationchange is deprecated and missing on some Android builds;
  // the media query fires reliably there. Both routes are idempotent.
  const mq = window.matchMedia('(orientation: landscape)');
  const onMq = () => syncFullscreenToOrientation();
  if (mq.addEventListener) mq.addEventListener('change', onMq);
  else if (mq.addListener) mq.addListener(onMq);

  // Leaving fullscreen by any other route — swipe-down, back button, Esc
  // — must also release the orientation lock, or the device stays stuck
  // in landscape after the player has left the game.
  const onFsChange = () => { if (!fsEl()) restoreOrientation(); setTimeout(resize, 60); };
  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);

  // Already sideways when the page opened.
  if (isLandscape()) armGesture();
}

// Previous on-screen position per entity, so an arrow's heading can be
// derived from its actual movement. Clients never receive velocity (see
// netcode.js's Codec), so this is the only way to know which way a
// projectile is pointing there — same technique character.js already
// uses for its own velocity fallback. WeakMap so despawned projectiles
// clean themselves up.
const lastPos = new WeakMap();

function roundRect(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y,     x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x,     y + h, rr);
  ctx.arcTo(x,     y + h, x,     y,     rr);
  ctx.arcTo(x,     y,     x + w, y,     rr);
  ctx.closePath();
}

// A real arrow: shaft + head + fletching, rotated to face its heading.
function drawArrow(x, y, w, h, angle) {
  const cx = x + w / 2, cy = y + h / 2;
  const len = Math.max(w, h);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);

  // shaft
  ctx.strokeStyle = '#c9a227';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-len / 2, 0);
  ctx.lineTo(len / 2 - 5, 0);
  ctx.stroke();

  // head
  ctx.fillStyle = '#ffe08a';
  ctx.beginPath();
  ctx.moveTo(len / 2, 0);
  ctx.lineTo(len / 2 - 7, -4.5);
  ctx.lineTo(len / 2 - 7, 4.5);
  ctx.closePath();
  ctx.fill();

  // fletching
  ctx.strokeStyle = '#e2554f';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-len / 2, 0);      ctx.lineTo(-len / 2 + 6, -4);
  ctx.moveTo(-len / 2, 0);      ctx.lineTo(-len / 2 + 6, 4);
  ctx.moveTo(-len / 2 + 3, 0);  ctx.lineTo(-len / 2 + 9, -4);
  ctx.moveTo(-len / 2 + 3, 0);  ctx.lineTo(-len / 2 + 9, 4);
  ctx.stroke();
  ctx.restore();
}

function draw() {
  const now = performance.now();
  const animDt = Math.min(0.05, (now - lastFrameAt) / 1000);
  lastFrameAt = now;
  const t = now / 1000;


  const W = window.Level.WIDTH, H = window.Level.HEIGHT;
  const view = viewRect();
  const cw = window.innerWidth, ch = window.innerHeight;
  // Fill the window in follow mode (max, so no letterbox bars around a
  // small camera rect); fit the whole thing in whole-level mode (min).
  scale = window.Level.VIEW_MODE === 'follow'
    ? Math.max(cw / view.w, ch / view.h)
    : Math.min(cw / view.w, ch / view.h);
  offX = (cw - view.w * scale) / 2;
  offY = (ch - view.h * scale) / 2;

  // On touch devices the control pad occupies the bottom strip of the
  // window, and the action is at ground level — so a centred view puts
  // the players right behind the buttons. Shift the whole view up by
  // roughly half the pad's height: the characters clear the buttons, and
  // the extra room opens up above them, where the arrows come from.
  // Screen-space, applied after scale, so it's a constant number of
  // pixels regardless of how far the camera is zoomed.
  if (TOUCH_UI) offY -= TOUCH_VIEW_LIFT;

  ctx.save();
  ctx.setTransform(canvas.width / cw, 0, 0, canvas.height / ch, 0, 0);
  
  // Clear canvas so the 3D Three.js background shows through
  ctx.clearRect(0, 0, cw, ch);
  
  ctx.translate(offX, offY);
  ctx.scale(scale, scale);
  ctx.translate(-view.x, -view.y);

  const list = side.renderList();

  for (let i = 0; i < list.length; i++) {
    const e = list[i].entity;
    if (!e.isWindZone) continue;
    ctx.fillStyle = e.color;
    ctx.fillRect(list[i].x, list[i].y, e.w, e.h);
  }

  for (let i = 0; i < list.length; i++) {
    const it = list[i], e = it.entity;
    if (e.isWindZone) continue;
    // Camera boundary walls are invisible collision helpers, not scenery
    // (engine.js sets isCameraWall on them) — drawing them is what put
    // those stray rectangles on screen.
    if (e.isCameraWall) continue;
    const x = it.x, y = it.y;

    if (e instanceof Player) {
      let anim = animStates.get(e);
      if (!anim) { anim = window.Character.createAnimState(); animStates.set(e, anim); }
      const vx = (side === Host) ? e.vx : undefined;
      const vy = (side === Host) ? e.vy : undefined;
      // engine.js sets `dead` on the player and syncs it (see Player's
      // snapshot contract) — character.js has a dead pose, so pass the
      // real flag through rather than a hardcoded false.
      window.Character.update(anim, animDt, {
        x, y, vx, vy, facing: e.facing, grounded: e.grounded, dead: !!e.dead,
      });
      window.Character.draw(ctx, anim, { x, y, w: e.w, h: e.h, color: e.color });

    } else if (e.isProjectile || e.kind === 'arrow') {
      const prev = lastPos.get(e);
      let angle = Math.PI / 2; // falling straight down until we have a delta
      if (prev) {
        const dx = x - prev.x, dy = y - prev.y;
        if (dx * dx + dy * dy > 0.01) angle = Math.atan2(dy, dx);
        else if (prev.angle !== undefined) angle = prev.angle;
      }
      lastPos.set(e, { x, y, angle });
      drawArrow(x, y, e.w, e.h, angle);

    } else if (e.kind === 'death-orb') {
      // Drawn as a sibling of the decorative orb (same size, same bob) so
      // it doesn't announce itself as a hazard from across the level —
      // only the colour differs, and you have to get close to read it.
      // Host and client both run this Level.build(), so `kind` is set
      // locally on both sides and this branch is reached identically.
      const cx = x + e.w / 2, cy = y + e.h / 2 + 3 * Math.sin(t * 2 + x * 0.05);
      const pulse = 0.5 + 0.5 * Math.sin(t * 3.4);
      ctx.save();
      ctx.shadowColor = 'rgba(217,79,79,0.9)';
      ctx.shadowBlur = 10 + 10 * pulse;
      ctx.fillStyle = 'rgba(217,79,79,' + (0.6 + 0.35 * pulse) + ')';
      ctx.beginPath(); ctx.arc(cx, cy, e.w / 2, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,220,220,0.85)';
      ctx.beginPath(); ctx.arc(cx, cy, e.w / 5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

    } else if (e.isTriggerZone || e.kind === 'exit') {
      // Goal: pulsing glow + chevron, so it reads as "the thing to reach"
      // rather than a yellow rectangle.
      const pulse = 0.5 + 0.5 * Math.sin(t * 2.4);
      ctx.save();
      ctx.shadowColor = 'rgba(240,196,25,0.9)';
      ctx.shadowBlur = 14 + 10 * pulse;
      ctx.fillStyle = 'rgba(240,196,25,' + (0.16 + 0.12 * pulse) + ')';
      roundRect(x, y, e.w, e.h, 6); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255,224,138,' + (0.55 + 0.35 * pulse) + ')';
      ctx.lineWidth = 2;
      roundRect(x, y, e.w, e.h, 6); ctx.stroke();

      const cx = x + e.w / 2, cy = y + e.h / 2;
      const bob = 3 * Math.sin(t * 2.4);
      ctx.strokeStyle = 'rgba(255,236,180,0.95)';
      ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(cx - 9, cy + 4 + bob);
      ctx.lineTo(cx,     cy - 5 + bob);
      ctx.lineTo(cx + 9, cy + 4 + bob);
      ctx.stroke();
      ctx.restore();

    } else if (e.solid === false) {
      // Small decorative markers — soft dot instead of a hard square.
      ctx.save();
      ctx.globalAlpha = 0.5 + 0.3 * Math.sin(t * 2 + x * 0.05);
      ctx.fillStyle = e.color;
      ctx.beginPath();
      ctx.arc(x + e.w / 2, y + e.h / 2, e.w / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

    } else {
      // Platforms: body, lit top edge, subtle grounding shadow beneath.
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      roundRect(x + 2, y + 4, e.w, e.h, 4); ctx.fill();
      ctx.fillStyle = e.color || '#4a4a5e';
      roundRect(x, y, e.w, e.h, 4); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.16)';
      roundRect(x + 2, y + 1.5, e.w - 4, 3, 1.5); ctx.fill();
    }

    if (e instanceof Box && e.carried) {
      ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.5;
      ctx.strokeRect(x + 1, y + 1, e.w - 2, e.h - 2);
    }
  }
  ctx.restore();
}

function mySlot() { return side === Host ? Host.mySlot : Client.mySlot; }

function hud() {
  if (side === Host) {
    hudEl.textContent =
      `HOST players:${Host.nw.players.size}  tick:${Host.tick}  ` +
      `steps:${Host.stats.steps}  sim:${Host.stats.simMs.toFixed(2)}ms  ` +
      `${CFG.SIM_HZ}Hz sim / ${CFG.SNAPSHOT_HZ}Hz net`;
  } else {
    const s = Client.stats;
    const stale = s.lastRecv ? Math.round(performance.now() - s.lastRecv) : 0;
    hudEl.textContent =
      `CLIENT slot:${Client.mySlot}  gap:${Math.round(s.gap)}ms  since:${stale}ms  ` +
      `snaps:${s.snaps}  teleports:${s.teleports}`;
  }
}

/* ---------- countdown ----------
   Implemented by simply NOT calling side.update(now) until it expires.
   On the host that freezes the whole simulation — no gravity, no arrows,
   no snapshots go out — so there is no way to die during the countdown
   and no need to separately gate input. Clients are frozen for the same
   reason: with no snapshots arriving there is nothing to advance to.
   That's why this is safe to run locally on each side without syncing
   the countdown itself over the wire. */
const COUNTDOWN_SECS = 3;
let countdownEndsAt = 0;

function startCountdown() {
  countdownEndsAt = performance.now() + COUNTDOWN_SECS * 1000;
  $('countdown').classList.add('on');
}

function tickCountdown(now) {
  if (!countdownEndsAt) return false;
  const left = countdownEndsAt - now;
  if (left <= 0) {
    countdownEndsAt = 0;
    $('countdown').classList.remove('on');
    showToast('GO!', 700);
    return false;
  }
  const secs = Math.ceil(left / 1000);
  const el = $('cdNum');
  const label = secs <= 0 ? 'GO' : String(secs);
  if (el.textContent !== label) {
    el.textContent = label;
    // Re-trigger the pop animation on each new number.
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
  }
  return true;
}

/* ---------- transient messages ---------- */
let toastTimer = null;
function showToast(msg, ms) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), ms || 1400);
}

/* ---------- death / restart + exit feedback ----------
   Both are derived from state that's already synced, so they work
   identically on host and client without new messages: `dead` is part of
   the player snapshot, and a player vanishing from the world is how
   'each' mode removes someone who went through the portal. */
let wasDead = false;
let lastPlayerCount = -1;
let peakPlayerCount = 0;
let lastResetGen = -1;

function updateFeedback() {
  const slot = mySlot();
  const players = side === Host ? side.nw.players
                                : (Client.nw ? Client.nw.players : null);
  if (!players) return;

  const me = players.get(slot);
  const dead = !!(me && me.dead);
  if (dead && !wasDead) showToast('Hit! Restarting…', 1500);
  wasDead = dead;

  // Exit progress. peakPlayerCount is the high-water mark rather than a
  // fixed total, because a level page can be joined mid-session and the
  // authoritative room size isn't exposed to clients — the number of
  // players ever seen at once is the closest honest stand-in.
  const n = players.size;
  if (n > peakPlayerCount) peakPlayerCount = n;
  if (n !== lastPlayerCount) {
    if (lastPlayerCount >= 0 && n < lastPlayerCount && me) {
      showToast('A player made it through!', 1200);
    }
    lastPlayerCount = n;
  }
  const out = Math.max(0, peakPlayerCount - n);
  const prog = $('exitProg');
  if (peakPlayerCount > 1) {
    prog.textContent = out + ' / ' + peakPlayerCount + ' through the portal';
    prog.classList.add('on');
  } else {
    prog.classList.remove('on');
  }

  // A player leaving can force the level to restart (netcode's 'each'
  // mode won't hand out a win nobody earned — see Host.drop). That comes
  // through as the world's reset generation ticking over while nobody
  // died, so it needs its own message rather than the "Hit!" one.
  const gen = side === Host ? side.nw.world.resetGeneration : Client.resetGen;
  if (typeof gen === 'number') {
    if (lastResetGen >= 0 && gen !== lastResetGen && !dead) {
      // Everyone reappearing at once means the room was rebuilt, not that
      // one person respawned.
      if (n > lastPlayerCount) showToast('A player left — restarting.', 1800);
      peakPlayerCount = n;
    }
    lastResetGen = gen;
  }
}

function frame(now) {
  if (!running) return;
  const counting = tickCountdown(now);
  if (!counting) {
    side.update(now);
    updateFeedback();
  }
  draw();
  hud();
  requestAnimationFrame(frame);
}

function endSession(reason) {
  running = false;
  clearInterval(voiceHeartbeat);
  $('endedMsg').textContent = reason || 'Session ended';
  $('ended').classList.add('on');
  try { if (peer && !peer.destroyed) peer.destroy(); } catch (e) {}
}
// Reload starts clean. Without clearing this, a reload after finishing
// would try to resume the session we just wrote for the hand-off — and
// on the 'done' branch that snapshot is intentionally null, which the
// resume path can't rebuild a room from.
$('endedBtn').onclick = () => {
  try { sessionStorage.removeItem('dt-session'); } catch (e) {}
  location.reload();
};

// --- level-complete hand-off ---
// Per the HANDOFF CONTRACT (netcode.js), this writes sessionStorage
// correctly for whichever role we are, then SHOULD navigate to
// LEVELS[msg.next].url — but that manifest (index -> URL) is owned by
// lobby.js, which this file doesn't have. Flagging rather than
// guessing a URL: session state is written correctly so the actual
// navigation line is a one-line addition once the manifest exists.
function onLevelComplete(msg) {
  running = false;
  $('exitProg').classList.remove('on');

  // Credit the local device for this level before going anywhere — it's
  // what unlocks the next tile in the lobby grid on this browser.
  try { if (window.Progress) window.Progress.markComplete(msg.level); } catch (e) {}

  try {
    const payload = (side === Host)
      ? { role: 'host', roomCode: Host.selfId,
          hostSnapshot: msg.done ? null : Host.snapshot(msg.next) }
      : { role: 'client', roomCode: Client.conn.peer,
          token: Client.myToken, level: msg.next };
    if (msg.done) { sessionStorage.removeItem('dt-session'); }
    else { sessionStorage.setItem('dt-session', JSON.stringify(payload)); }
  } catch (e) { console.error('[handoff] failed to persist session', e); }

  // Host only: detach the pagehide 'bye' broadcast BEFORE navigating, or
  // every client is told the session ended a split second before they
  // were going to follow us to the same page.
  if (side === Host) Host.prepareHandoff();

  if (msg.done) {
    $('endedMsg').textContent = 'All levels complete — nice work!';
    $('endedBtn').textContent = 'Back to lobby';
    $('ended').classList.add('on');
    $('endedBtn').onclick = () => { location.href = LOBBY_URL; };
    return;
  }

  let url = null;
  try { url = window.Levels.urlFor(msg.next); } catch (e) {}
  if (!url) {
    $('endedMsg').textContent = 'Level complete — but level ' + msg.next + ' has no page in levels.js.';
    $('endedBtn').textContent = 'Back to lobby';
    $('ended').classList.add('on');
    $('endedBtn').onclick = () => { location.href = LOBBY_URL; };
    return;
  }

  showToast('Level complete!', 1200);
  setTimeout(() => { location.href = url; }, 1000);
}

function begin(which) {
  side = which;
  boot.style.display = 'none';
  stage.classList.add('on');
  resize();
  running = true;

  const slot = mySlot();
  if (slot >= 0) {
    $('youAreSwatch').style.background = PALETTE[slot % PALETTE.length];
    $('youAre').classList.add('on');
  }

  initVoice();
  startCountdown();
  requestAnimationFrame(frame);
}

// --- voice/settings UI, backed by voicechat-adapter.js's VoiceUI ---
let voiceHeartbeat = null;

function currentRoster() {
  // Both sides now get the full room list, so voice is a true mesh:
  // the host reads its own peer map; a client reads the roster the host
  // pushes down (folded into 'welcome' on join/rejoin, re-sent on every
  // membership change — see VOICE ROSTER in netcode.js). Game traffic is
  // still star-only; these ids are used solely to place voice calls.
  if (side === Host) return Host.rosterIds();
  return (Client.roster && Client.roster.length) ? Client.roster
                                                  : [Client.conn.peer, myPeerId];
}

function renderVoicePanel() {
  if (!window.VoiceUI || !window.VoiceUI.isSupported()) return;
  const V = window.VoiceUI;

  $('selfMuteBtn').classList.toggle('muted', V.isSelfMuted());

  const mode = V.getMode();
  for (const btn of $('modeSwitch').children) {
    btn.classList.toggle('active', btn.dataset.mode === mode);
  }

  const dotsEl = $('voiceDots');
  dotsEl.innerHTML = '';
  const peerListEl = $('peerList');
  peerListEl.innerHTML = '';
  for (const id of currentRoster()) {
    if (id === myPeerId) continue;
    const dot = document.createElement('div');
    dot.className = 'vdot' + (V.isPeerSpeaking(id) ? ' speaking' : '');
    dotsEl.appendChild(dot);

    const row = document.createElement('div');
    row.className = 'peerRow';
    const muteBtn = document.createElement('button');
    muteBtn.className = 'vbtn';
    muteBtn.style.width = '22px'; muteBtn.style.height = '22px'; muteBtn.style.fontSize = '11px';
    muteBtn.textContent = V.isPeerLocallyMuted(id) ? '🔇' : '🔊';
    muteBtn.onclick = () => V.togglePeerMute(id);
    const vol = document.createElement('input');
    vol.type = 'range'; vol.min = 0; vol.max = 100; vol.value = Math.round(V.getPeerVolume(id) * 100);
    vol.oninput = () => V.setPeerVolume(id, vol.value / 100);
    row.append(muteBtn, vol);
    peerListEl.appendChild(row);
  }
}

async function initVoice() {
  if (!window.VoiceUI || !window.VoiceUI.isSupported()) return;
  await window.VoiceUI.init(peer, { onSpeakingChange: renderVoicePanel, onPeerConnected: renderVoicePanel, onPeerDisconnected: renderVoicePanel });
  $('voiceBar').classList.add('on');

  // Re-mesh the moment membership changes, rather than waiting up to a
  // full heartbeat. Both sides expose the same hook.
  const onRosterChange = () => {
    window.VoiceUI.sync(currentRoster(), myPeerId);
    renderVoicePanel();
  };
  if (side === Host) Host.onRoster = onRosterChange;
  else Client.onRoster = onRosterChange;

  // Heartbeat stays as the self-healing backstop: sync() is idempotent,
  // so a roster message lost on the unreliable channel costs a couple of
  // seconds of missing voice rather than a permanently broken call.
  voiceHeartbeat = setInterval(() => {
    window.VoiceUI.sync(currentRoster(), myPeerId);
  }, 2000);
  window.VoiceUI.sync(currentRoster(), myPeerId);
  window.VoiceUI.onChange(renderVoicePanel);
  renderVoicePanel();
}

$('selfMuteBtn').onclick = () => window.VoiceUI && window.VoiceUI.toggleSelfMute();
$('settingsBtn').onclick = () => $('voicePanel').classList.toggle('on');
for (const btn of $('modeSwitch').children) {
  btn.onclick = () => window.VoiceUI && window.VoiceUI.setMode(btn.dataset.mode);
}
$('leaveBtn').onclick = () => {
  try { sessionStorage.removeItem('dt-session'); } catch (e) {}
  if (side === Host) { try { Host.shutdown(); } catch (e) {} }
  else { try { Client.end('You left.'); } catch (e) {} }
  endSession('You left the session.');
};

// PeerJS's signalling server connection can drop without the existing
// WebRTC data channels dying — established play continues fine, but no
// NEW peer can find us until it's back. Reconnecting keeps the room
// joinable instead of silently going dark.
function wirePeerRecovery() {
  if (!peer) return;
  peer.on('disconnected', () => {
    if (!peer || peer.destroyed) return;
    showToast('Reconnecting…', 1200);
    try { peer.reconnect(); } catch (e) {}
  });
}

// --- solo test path (no lobby exists yet to hand this off from) ---
// Uses an AUTO-ASSIGNED peer id (never a fixed room code), so it can
// never collide with a leftover id from a previous test run — that's
// what "ID taken" was: a stale registration of a FIXED id (the room
// code) from a prior session that hadn't cleared yet. This path doesn't
// need a fixed id at all since nobody else is joining.
function startSolo() {
  setStatus('Starting solo test…');
  peer = new Peer({ debug: 1 });
  peer.on('open', id => {
    myPeerId = id;
    Host.prepare(peer, setStatus, { totalLevels: 1, onComplete: onLevelComplete });
    Host.lock(0);
    Host.start(peer, input, setStatus, endSession);
    begin(Host);
  });
  wirePeerRecovery();
  peer.on('error', e => setStatus('Peer error: ' + e.type));
}
$('soloBtn').onclick = startSolo;

// --- entry: resume-only, per HANDOFF CONTRACT item 5. No host/join UI
// here — this page is only ever reached via hand-off from the lobby.
// Solo test button is the escape hatch until a real lobby exists. ---
function bootFromSession() {
  let sess = null;
  try { sess = JSON.parse(sessionStorage.getItem('dt-session') || 'null'); } catch (e) {}

  if (!sess) {
    setStatus('No session found.');
    $('soloBtn').style.display = 'inline-block';
    return;
  }

  if (sess.role === 'host') {
    if (!sess.hostSnapshot || !sess.hostSnapshot.roomCode) {
      // Written by a 'done' hand-off, or storage got mangled. Nothing to
      // rebuild a room from, so offer the clean path rather than throwing
      // deep inside restore().
      setStatus('That session has already finished.');
      $('soloBtn').style.display = 'inline-block';
      return;
    }
    setStatus('Reconnecting as host…');
    peer = new Peer(sess.roomCode, { debug: 1 });
    peer.on('open', id => {
      myPeerId = id;
      Host.restore(peer, sess.hostSnapshot, input, setStatus, endSession, onLevelComplete);
      begin(Host);
    });
    wirePeerRecovery();
    peer.on('error', e => {
      if (e.type === 'unavailable-id') {
        setStatus('Room code "' + sess.roomCode + '" is still registered from a previous session ' +
                   '(close any other tabs using it, or wait a moment and reload).');
      } else {
        setStatus('Peer error: ' + e.type);
      }
    });
  } else if (sess.role === 'client') {
    setStatus('Reconnecting…');
    peer = new Peer({ debug: 1 });
    peer.on('open', id => {
      myPeerId = id;
      const conn = peer.connect(sess.roomCode, { reliable: false, serialization: 'json' });
      conn.on('open', () => {
        Client.rejoin(conn, sess.token, input, setStatus, endSession, onLevelComplete);
        // Early warning of a degrading path — Client widens its
        // interpolation buffer rather than stuttering once packets
        // actually start arriving late.
        const pc = conn.peerConnection;
        if (pc) {
          pc.addEventListener('iceconnectionstatechange', () => {
            const st = pc.iceConnectionState;
            if (st === 'disconnected' || st === 'failed') Client.flagUnstable();
          });
        }
      });
      conn.on('data', msg => {
        Client.onData(msg);
        if (msg && msg.type === 'welcome' && !running) begin(Client);
      });
      conn.on('close', () => endSession('Host ended the session.'));
      conn.on('error', () => setStatus('Connection error.'));
    });
    wirePeerRecovery();
    peer.on('error', e => {
      setStatus(e.type === 'peer-unavailable'
        ? 'The host is no longer hosting that room.'
        : 'Peer error: ' + e.type);
    });
  } else {
    setStatus('Unrecognized session — open this level from the lobby.');
  }
}

resize();
bootFromSession();
})();
</script>
</body>
</html>
